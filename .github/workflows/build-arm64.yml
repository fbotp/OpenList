name: Build with Custom Script (ARM64)

on:
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev gcc

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.1' # 请根据您的项目要求调整版本

      - name: Download and extract external Vite dist
        run: |
          wget https://github.com/OpenListTeam/OpenList-Frontend/releases/download/v4.1.2/openlist-frontend-dist-lite-v4.1.2.tar.gz -O temp.tar.gz
          
          # 解压到 public/dist 目录
          tar -xvf temp.tar.gz -C public/dist
          
          # 清理临时文件
          rm -f temp.tar.gz

      - name: Make build script executable
        run: chmod +x mybuild.sh # 这是关键步骤！确保脚本有执行权限

      - name: Run custom build script for ARM64
        run: |
          # 设置环境变量供您的脚本使用，然后执行脚本
          export GOOS=linux
          export GOARCH=arm64
          export CGO_ENABLED=1
          ./mybuild.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: built-binaries
          path: |
            OpenList
